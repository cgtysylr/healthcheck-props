apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcheck-controller
  namespace: healthcheck
  labels:
    app: healthcheck-controller
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcheck-controller
  template:
    metadata:
      labels:
        app: healthcheck-controller
        version: v1
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
      - name: healthcheck-controller
        image: atrosdc/healthcheck-probs:1.0.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: FLASK_ENV
          valueFrom:
            configMapKeyRef:
              name: healthcheck-controller-config
              key: flask_env
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          exec:
            command:
            - /usr/local/bin/healthcheck-probe.sh 
          initialDelaySeconds: 30 # 30 saniye sonra liveness probe başlar
          periodSeconds: 10 # 10 saniyede bir kontrol eder
          timeoutSeconds: 30 # 30 saniye timeout
          failureThreshold: 6 # 6 kez başarısız olursa restart eder (10 saniye * 6 = 1 dakika)
          successThreshold: 1 # 1 kez başarılı olursa probe başarılı olarak kabul edilir
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true

